{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
<h2 class="mb-3">Enter Verification Code</h2>
<p class="text-muted">A 6-digit OTP code has been sent to the borrower's mobile phone.</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">6-Digit OTP Code</label>
        <input type="text" name="otp_code" class="form-control" placeholder="123456" maxlength="6" required style="letter-spacing: 4px; font-size: 1.2rem; text-align: center;">
    </div>
    <button type="submit" class="btn btn-success w-100">Verify & Complete Registration</button>
</form>
</div>
{% endblock %}
