{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">New Loan Application</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'create_loan' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="client" class="form-label font-weight-bold">Select Borrower / Client</label>
                            <select name="client" id="client" class="form-select" required>
                                <option value="">-- Choose Borrower --</option>
                                {% for client in clients %}
                                    <option value="{{ client.id }}">{{ client.first_name }} {{ client.last_name }} ({{ client.ghana_card_number }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label font-weight-bold">Loan Amount (GHS)</label>
                            <input type="number" step="0.01" min="1" name="amount" id="amount" class="form-control" placeholder="e.g. 1000.00" required>
                        </div>

                        <div class="mb-3">
                            <label for="duration_months" class="form-label font-weight-bold">Duration (Months)</label>
                            <select name="duration_months" id="duration_months" class="form-select" required>
                                <option value="1">1 Month (4 Weeks)</option>
                                <option value="2">2 Months (8 Weeks)</option>
                                <option value="3" selected>3 Months (12 Weeks)</option>
                                <option value="4">4 Months (16 Weeks)</option>
                                <option value="6">6 Months (24 Weeks)</option>
                                <option value="12">12 Months (52 Weeks)</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'loan_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Submit Loan Application</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
