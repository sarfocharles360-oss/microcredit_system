<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | Anchor Crest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-body p-4 text-center">
                        <h4 class="mb-3 text-primary fw-bold">Verification Required</h4>
                        <p class="text-muted">Enter the 6-digit verification code sent to your mobile phone via SMS.</p>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger py-2 mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input type="text" name="otp_code" class="form-control text-center fs-4 letter-spacing-2" placeholder="000000" maxlength="6" required autofocus autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Verify Code</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
