{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Client Details: {{ client.get_full_name }}</h2>
    <p><strong>ID Number:</strong> {{ client.id_number }}</p>
    <p><strong>Phone:</strong> {{ client.phone_number }}</p>
    <p><strong>Email:</strong> {{ client.email }}</p>
    <p><strong>Address:</strong> {{ client.address }}</p>
    <a href="/clients/" class="btn btn-primary">Back to Directory</a>
</div>
{% endblock %}
