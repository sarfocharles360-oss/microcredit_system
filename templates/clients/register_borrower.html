{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Register New Borrower</h3>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label font-weight-bold">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label font-weight-bold">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone_number" class="form-label font-weight-bold">Phone Number (Ghanaian Network)</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number" placeholder="024XXXXXXX or 020XXXXXXX" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label font-weight-bold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="id_number" class="form-label font-weight-bold">Ghana Card Number (GHA-XXXXXXXXX-X)</label>
                        <input type="text" class="form-control" id="id_number" name="id_number" placeholder="GHA-000000000-0" required>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label font-weight-bold">Residential Address / GhanaPost Digital Address</label>
                        <textarea class="form-control" id="address" name="address" rows="2" placeholder="e.g. WS-123-4567, Takoradi" required></textarea>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Send Verification Code</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
