{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Client Directory</h2>
    <a href="/clients/add/" class="btn btn-primary mb-3">Register New Borrower</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID Number</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ client.id_number }}</td>
                <td>{{ client.get_full_name }}</td>
                <td>{{ client.phone_number }}</td>
                <td><a href="/clients/{{ client.id }}/" class="btn btn-sm btn-info">View Details</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No clients registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
